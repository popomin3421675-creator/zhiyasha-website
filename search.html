<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>站內搜尋｜知芽社</title><link rel="stylesheet" href="style.css"></head><body><main class="panel"><a class="back" href="index.html">← 返回首頁</a><h1>站內搜尋</h1><p>輸入關鍵字，搜尋目前已建立的網站頁面。</p><input id="q" type="search" placeholder="例如：心臟、影片、遊戲" aria-label="搜尋關鍵字"><div id="results" class="chips" style="margin-top:20px"></div><script>const pages=[{t:"衛教專區",u:"education.html"},{t:"心臟衛教",u:"heart.html"},{t:"照護指引",u:"care.html"},{t:"衛教影片",u:"videos.html"},{t:"互動遊戲",u:"https://heart-school-publish.vercel.app/"},{t:"最新消息",u:"news.html"},{t:"聯絡我",u:"contact.html"}];const q=document.getElementById("q"),r=document.getElementById("results");function update(){let s=q.value.trim().toLowerCase();r.replaceChildren();for(const p of pages.filter(p=>!s||p.t.toLowerCase().includes(s))){let a=document.createElement("a");a.textContent=p.t;a.href=p.u;r.append(a)}if(!r.children.length)r.textContent="找不到符合的頁面。"}q.addEventListener("input",update);update()</script></main></body></html>
